user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-Performance Logging with Upstream Timing
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'upstream: $upstream_addr '
                          'response_time: $upstream_response_time '
                          'cache: $upstream_cache_status';

    access_log /var/log/nginx/access.log main_timed;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # Slowloris and DDoS Timeout Hardening
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 5s;
    client_max_body_size 1m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Edge Microcache Zone for Static Assets
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=EDGE_STATIC:20m max_size=1g inactive=24h use_temp_path=off;

    # Global Base Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Docker Embedded DNS Resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─── Load Balanced API Cluster (3 Replicas) ───
    upstream flash_sale_api_cluster {
        # Least connected algorithm: routes to the least busy API replica
        least_conn;

        server api-1:3000 max_fails=3 fail_timeout=10s;
        server api-2:3000 max_fails=3 fail_timeout=10s;
        server api-3:3000 max_fails=3 fail_timeout=10s;

        # Keepalive persistent connections to backend Node.js pods
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ─── Load Balancer Health Probe ───
        location = /health {
            proxy_pass http://flash_sale_api_cluster/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            access_log off;
        }

        # ─── Edge Caching for Static Assets (<180KB bundle) ───
        location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://flash_sale_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Edge Cache Configuration
            proxy_cache EDGE_STATIC;
            proxy_cache_valid 200 304 24h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            add_header X-Edge-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=86400, s-maxage=86400, stale-while-revalidate=3600";
            expires 1d;
        }

        # ─── Dynamic API Endpoints (/api/*) ───
        location /api/ {
            proxy_pass http://flash_sale_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Reverse Proxy Header Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fast Timeouts to Prevent API Worker Pool Starvation
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Expose which backend pod handled the request
            add_header X-Served-By $upstream_addr always;
        }

        # ─── Default Web App Shell (index.html) ───
        location / {
            proxy_pass http://flash_sale_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Never cache HTML so sale time and real-time DOM remain fresh
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Served-By $upstream_addr always;
        }
    }
}

